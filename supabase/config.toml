[functions.student-access]
verify_jwt = false

[functions.staff-accounts]
verify_jwt = true

# Formulario público de propuestas de talleres: sin login por diseño. La función valida estrictamente el input,
# no confía en nada del cliente y es la única frontera pública de escritura.
[functions.workshop-intake]
verify_jwt = false

# La revisión exige sesión Staff con rol Coordinación; la función también valida el usuario.
[functions.workshop-admin]
verify_jwt = true

[functions.preparation-reset]
verify_jwt = true

# Restablecer contraseña de participantes: exige sesión Staff/Coordinación y la función valida el rol.
[functions.participant-admin]
verify_jwt = true
